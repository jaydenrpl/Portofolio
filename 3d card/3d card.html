<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Flip Card Keren</title>
    <link rel="stylesheet" href="3dcard.css" />
  </head>
  <body>
    <div class="card-container">
      <div class="card-inner">
        <div class="card-front">
          <div class="avatar">🔥</div>
          <h2>Shadow Knight</h2>
          <p>Level 99 Warrior</p>
        </div>

        <div class="card-back">
          <h3>Karakter Status</h3>
          <div class="stats">
            <p>⚔️ Attack: 850</p>
            <p>🛡️ Defense: 620</p>
            <p>⚡ Speed: 940</p>
          </div>
          <button class="btn-play">Pilih Hero</button>
        </div>
      </div>
    </div>
  </body>
</html>
